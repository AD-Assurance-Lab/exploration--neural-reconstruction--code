[project]
name = "neural_reconstruction"
version = "0.1.0"
description = "Pose-paired disturbance endpoints from neural scene reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
